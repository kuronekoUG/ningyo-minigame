<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img" aria-label="後ろ向きに泳ぐ人魚">
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.72" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#dcecef"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a70"/>
      <stop offset="1" stop-color="#dd4f58"/>
    </linearGradient>
  </defs>

  <!-- Tiny side fins sit behind the round body. -->
  <path d="M31 65C18 64 12 72 17 81c4 7 13 8 22 2" fill="#fffaf0" stroke="#172c4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M125 65c13-1 19 7 14 16-4 7-13 8-22 2" fill="#fffaf0" stroke="#172c4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A short, toy-like fish body and its sideways curl. -->
  <path d="M43 79c4 25 18 39 37 40 18 1 31-9 38-25 7 6 13 9 21 7-6 8-6 14 0 21-9 1-16-2-22-8-10 10-23 15-38 14-25-2-40-18-42-45z" fill="url(#coral)" stroke="#172c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 95c7-11 15-14 25-11-3 8-8 13-15 17 7 2 12 7 15 15-10 3-19-1-27-10" fill="#f36b66" stroke="#172c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Oversized round head: the defining silhouette from the reference. -->
  <path d="M78 12c29 0 52 22 52 51 0 27-20 45-51 45S27 90 27 63c0-29 22-51 51-51z" fill="url(#pearl)" stroke="#172c4f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M35 79c10 8 25 12 44 12 19 0 34-4 44-12" fill="none" stroke="#bfdadd" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- Coral forelock visible from behind. -->
  <path d="M68 16c3-8 8-12 14-11 6 1 10 6 11 14-8-4-16-5-25-3z" fill="#ff665f" stroke="#172c4f" stroke-width="4" stroke-linejoin="round"/>

  <!-- Broad scallops keep the fish body readable at game size. -->
  <g fill="none" stroke="#a93f4d" stroke-width="3.5" stroke-linecap="round">
    <path d="M45 88c5 7 12 7 17 0 5 8 13 8 18 0 5 8 13 8 18 0 5 7 12 7 17 0"/>
    <path d="M52 104c5 7 12 7 17 0 5 8 13 8 18 0 5 7 12 7 17 0"/>
  </g>
  <path d="M37 75c2 5 4 8 8 11M119 75c-2 5-4 8-8 11" fill="none" stroke="#172c4f" stroke-width="4" stroke-linecap="round"/>
</svg>
